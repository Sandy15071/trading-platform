[project]
name = "option-chain-momentum-indicator"
version = "1.0.0"
description = "Real-time Option Chain Momentum Indicator platform with Zerodha Kite Connect"
readme = "PRD-option-chain-momentum-indicator.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiofiles>=23.2.1",
    "kiteconnect>=4.2.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
